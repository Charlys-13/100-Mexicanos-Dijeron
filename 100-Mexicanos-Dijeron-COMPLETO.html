<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Mexicanos Dijeron - Juego Editable</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#173f9e,#04102d 48%,#020617);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:24px}.center{text-align:center}.badge{display:inline-block;background:#facc15;color:#08225a;font-weight:900;padding:9px 20px;border-radius:999px}.title{font-size:clamp(34px,6vw,64px);margin:10px 0 4px}.sub{color:#a5f3fc;letter-spacing:3px;font-weight:bold}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:25px 0}.team,.board,.editor{background:#071b50dd;border:1px solid #38bdf866;border-radius:20px;padding:18px}.team{display:flex;justify-content:space-between;align-items:center}.team input{background:transparent;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:9px;font-size:16px;font-weight:bold;width:65%}.score{font-size:42px;font-weight:900;color:#fde047}.vs{background:#fde047;color:#08225a;font-weight:900;padding:15px 11px;border-radius:50%}.toolbar,.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.blue{background:#0284c7;color:white}.yellow{background:#facc15;color:#08225a}.green{background:#059669;color:white}.red{background:#dc2626;color:white}.light{background:#e2e8f0;color:#0f172a}.board{border:4px solid #facc15}.meta{display:flex;justify-content:space-between;color:#a5f3fc;font-weight:bold}.question{text-align:center;font-size:clamp(24px,4vw,42px);margin:20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:76px;background:linear-gradient(90deg,#06133d,#17134e);border:2px solid #0891b2;border-radius:13px;color:white;display:flex;align-items:center;gap:13px;padding:10px 15px;cursor:pointer}.answer.revealed{background:linear-gradient(90deg,#fde047,#fb923c);color:#08225a;border-color:white}.num{background:#1d4ed8;color:#fff;border-radius:9px;padding:10px 14px;font-weight:900}.answerText{flex:1;text-align:left;font-size:20px;font-weight:900}.points{font-size:27px;font-weight:900}.strikes{height:95px;display:flex;justify-content:center;align-items:center;gap:12px}.strike{font-size:65px;font-weight:900;color:#ef4444;text-shadow:0 0 20px #ef4444}.editor{background:#fff;color:#0f172a;margin-top:20px}.editor input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.row{display:grid;grid-template-columns:1fr 95px 45px;gap:8px;margin:8px 0}.hidden{display:none}.small{font-size:13px;color:#64748b}.roundtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}@media(max-width:700px){.answers{grid-template-columns:1fr}.teams{grid-template-columns:1fr}.vs{display:none}.app{padding:12px}} </style></head><body><div id="app"></div><script>
const defaults=[{question:'Menciona algo que la gente hace al despertarse',answers:[{text:'Revisar el celular',points:35},{text:'Ir al baño',points:25},{text:'Apagar la alarma',points:18},{text:'Bañarse',points:12},{text:'Tomar café',points:10}]},{question:'Menciona algo que llevas a la playa',answers:[{text:'Toalla',points:32},{text:'Bloqueador solar',points:27},{text:'Traje de baño',points:21},{text:'Lentes de sol',points:12},{text:'Sombrilla',points:8}]},{question:'Menciona algo que encuentras en un hotel',answers:[{text:'Cama',points:30},{text:'Recepción',points:25},{text:'Alberca',points:18},{text:'Restaurante',points:15},{text:'Elevador',points:12}]}];
let questions=JSON.parse(localStorage.getItem('mexQuestions')||'null')||defaults, qi=0,revealed={},strikes=0,mult=1,seconds=30,timer=null,bank=0,teamA={name:'Equipo A',score:0},teamB={name:'Equipo B',score:0},editing=false;
const save=()=>localStorage.setItem('mexQuestions',JSON.stringify(questions)); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function boardPoints(){return questions[qi].answers.reduce((s,a,i)=>s+(revealed[qi+'-'+i]?Number(a.points):0),0)*mult}
function render(){let q=questions[qi];document.getElementById('app').innerHTML=`<main class="app"><header class="center"><span class="badge">🏆 GRAN ENCUESTA</span><h1 class="title">100 MEXICANOS DIJERON</h1><div class="sub">EDICIÓN INTERACTIVA</div></header><section class="teams"><div class="team"><input id="teamA" value="${esc(teamA.name)}"><span class="score">${teamA.score}</span></div><div class="vs">VS</div><div class="team"><input id="teamB" value="${esc(teamB.name)}"><span class="score">${teamB.score}</span></div></section><div class="toolbar"><button class="btn blue" onclick="toggleTimer()">⏱ ${timer?'Pausar':'Iniciar'} ${seconds}s</button><button class="btn light" onclick="resetTimer()">30s</button>${[1,2,3].map(n=>`<button class="btn ${mult===n?'yellow':'light'}" onclick="mult=${n};render()">x${n}</button>`).join('')}<button class="btn light" onclick="document.documentElement.requestFullscreen?.()">⛶ Pantalla completa</button></div><section class="board"><div class="meta"><span>RONDA ${qi+1} / ${questions.length}</span><span>⚡ BOLSA: <b>${boardPoints()}</b></span></div><h2 class="question">${esc(q.question)}</h2><div class="answers">${q.answers.map((a,i)=>`<button class="answer ${revealed[qi+'-'+i]?'revealed':''}" onclick="reveal(${i})"><span class="num">${i+1}</span><span class="answerText">${revealed[qi+'-'+i]?esc(a.text):'••••••••••'}</span><span class="points">${revealed[qi+'-'+i]?a.points:'?'}</span></button>`).join('')}</div></section><div class="strikes">${'❌'.repeat(strikes).split('').map(x=>`<span class="strike">${x}</span>`).join('')}</div><div class="actions"><button class="btn red" onclick="strikes=Math.min(3,strikes+1);render()">❌ ERROR</button><button class="btn light" onclick="strikes=Math.max(0,strikes-1);render()">Quitar error</button><button class="btn blue" onclick="bank=boardPoints();render()">Guardar bolsa (${boardPoints()})</button><button class="btn yellow" onclick="award('A')">🏆 A +${bank||boardPoints()}</button><button class="btn yellow" onclick="award('B')">🏆 B +${bank||boardPoints()}</button><button class="btn green" onclick="next()">SIGUIENTE RONDA</button><button class="btn light" onclick="editing=!editing;render()">⚙️ Editor</button><button class="btn light" onclick="resetGame()">↻ Reiniciar</button></div>${editing?editorHTML(q):''}<p class="center small" style="color:#7dd3fc">Las preguntas se guardan automáticamente en este navegador.</p></main>`;document.getElementById('teamA').oninput=e=>teamA.name=e.target.value;document.getElementById('teamB').oninput=e=>teamB.name=e.target.value}
function editorHTML(q){return `<section class="editor"><h2>Panel del conductor</h2><p class="small">Edita preguntas, respuestas y puntos. Los cambios se guardan automáticamente.</p><div class="roundtabs">${questions.map((_,i)=>`<button class="btn ${i===qi?'blue':'light'}" onclick="qi=${i};render()">Ronda ${i+1}</button>`).join('')}<button class="btn green" onclick="addQuestion()">+ Pregunta</button><button class="btn red" onclick="deleteQuestion()">Eliminar ronda</button></div><label>Pregunta</label><input value="${esc(q.question)}" onchange="questions[qi].question=this.value;save();render()">${q.answers.map((a,i)=>`<div class="row"><input value="${esc(a.text)}" onchange="questions[qi].answers[${i}].text=this.value;save()"><input type="number" value="${a.points}" onchange="questions[qi].answers[${i}].points=Number(this.value);save();render()"><button class="btn red" onclick="questions[qi].answers.splice(${i},1);save();render()">🗑</button></div>`).join('')}<button class="btn blue" onclick="questions[qi].answers.push({text:'Nueva respuesta',points:0});save();render()">+ Respuesta</button><button class="btn light" onclick="exportQuestions()">⬇ Exportar preguntas</button><label class="btn light" style="display:inline-block">⬆ Importar preguntas<input type="file" accept="application/json" class="hidden" onchange="importQuestions(this.files[0])"></label></section>`}
function reveal(i){revealed[qi+'-'+i]=!revealed[qi+'-'+i];render()} function award(t){let p=bank||boardPoints();t==='A'?teamA.score+=p:teamB.score+=p;bank=0;render()} function next(){qi=(qi+1)%questions.length;strikes=0;bank=0;mult=1;resetTimer();render()} function resetGame(){qi=0;revealed={};strikes=0;bank=0;mult=1;teamA.score=teamB.score=0;resetTimer();render()} function toggleTimer(){if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);timer=null;seconds=0}render()},1000)}render()} function resetTimer(){if(timer)clearInterval(timer);timer=null;seconds=30} function addQuestion(){questions.push({question:'Nueva pregunta',answers:[{text:'Respuesta 1',points:0}]});qi=questions.length-1;save();render()} function deleteQuestion(){if(questions.length===1)return;questions.splice(qi,1);qi=Math.max(0,qi-1);save();render()} function exportQuestions(){let b=new Blob([JSON.stringify(questions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='preguntas-100-mexicanos.json';a.click()} function importQuestions(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{questions=JSON.parse(r.result);qi=0;save();render()}catch(e){alert('Archivo JSON inválido')}};r.readAsText(f)} render();
</script></body></html>
