<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gran Encuesta</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#1744a5,#06133c 48%,#020617);color:white;min-height:100vh}.app{max-width:1100px;margin:auto;padding:20px}.center{text-align:center}.badge{display:inline-block;background:#facc15;color:#08225a;font-weight:900;padding:9px 20px;border-radius:99px}.title{font-size:clamp(34px,6vw,64px);margin:10px 0 4px}.sub{color:#a5f3fc;letter-spacing:3px;font-weight:bold}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:20px 0}.team,.board,.editor,.final{background:#071b50e8;border:1px solid #38bdf866;border-radius:20px;padding:18px}.team{display:flex;justify-content:space-between;align-items:center}.team input{background:transparent;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:9px;font-weight:bold;width:65%}.score{font-size:42px;font-weight:900;color:#fde047}.vs{background:#fde047;color:#08225a;font-weight:900;padding:14px;border-radius:50%}.toolbar,.actions,.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.blue{background:#0284c7;color:#fff}.yellow{background:#facc15;color:#08225a}.green{background:#059669;color:#fff}.red{background:#dc2626;color:#fff}.purple{background:#7c3aed;color:#fff}.light{background:#e2e8f0;color:#0f172a}.board{border:4px solid #facc15}.meta{display:flex;justify-content:space-between;color:#a5f3fc;font-weight:bold}.question{text-align:center;font-size:clamp(24px,4vw,40px);margin:20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:74px;background:linear-gradient(90deg,#06133d,#17134e);border:2px solid #0891b2;border-radius:13px;color:white;display:flex;align-items:center;gap:12px;padding:10px 15px;cursor:pointer;width:100%}.answer.revealed{background:linear-gradient(90deg,#fde047,#fb923c);color:#08225a;border-color:white}.num{background:#1d4ed8;color:white;border-radius:8px;padding:10px 14px;font-weight:900}.answerText{flex:1;text-align:left;font-size:20px;font-weight:900}.points{font-size:27px;font-weight:900}.strikes{height:90px;display:flex;justify-content:center;align-items:center;gap:10px}.strike{font-size:60px}.editor{background:white;color:#0f172a;margin-top:20px}.editor input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.row{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin:8px 0}.final{border:4px solid #a855f7}.finalQ{background:#ffffff12;border-radius:12px;padding:12px;margin:9px 0}.winner{text-align:center;color:#fde047;font-size:clamp(45px,8vw,85px);font-weight:1000;text-shadow:0 0 30px #f59e0b}.hidden{display:none}.small{font-size:13px;color:#64748b}@media(max-width:700px){.answers,.teams{grid-template-columns:1fr}.vs{display:none}}
</style></head><body><div id="app"></div><script>
const defaultQuestions=[
{question:'Menciona algo que la gente hace al despertarse',answers:[{text:'Revisar el celular',points:35},{text:'Ir al baño',points:25},{text:'Apagar la alarma',points:18},{text:'Bañarse',points:12},{text:'Tomar café',points:10}]},
{question:'Menciona algo que llevas a la playa',answers:[{text:'Toalla',points:32},{text:'Bloqueador solar',points:27},{text:'Traje de baño',points:21},{text:'Lentes de sol',points:12},{text:'Sombrilla',points:8}]},
{question:'Menciona algo que encuentras en un hotel',answers:[{text:'Cama',points:30},{text:'Recepción',points:25},{text:'Alberca',points:18},{text:'Restaurante',points:15},{text:'Elevador',points:12}]},
{question:'Menciona algo que haces durante unas vacaciones',answers:[{text:'Ir a la playa',points:34},{text:'Comer',points:24},{text:'Tomar fotos',points:18},{text:'Descansar',points:14},{text:'Salir de paseo',points:10}]}
];
const defaultFinal=[{question:'Algo que haces antes de dormir',answer:'Revisar el celular',points:40},{question:'Una bebida para el desayuno',answer:'Café',points:45},{question:'Algo que llevas de viaje',answer:'Maleta',points:50},{question:'Un lugar para vacacionar',answer:'Playa',points:35},{question:'Algo que encuentras en un hotel',answer:'Cama',points:30}];
let saved=JSON.parse(localStorage.getItem('granEncuestaV3')||'null');let questions=saved?.questions||defaultQuestions,finalQs=saved?.finalQs||defaultFinal,config=saved?.config||{title:'100 MEXICANOS DIJERON',subtitle:'EDICIÓN INTERACTIVA',goal:200};let qi=0,revealed={},strikes=0,mult=1,seconds=30,timer=null,bank=0,A={name:'Equipo A',score:0},B={name:'Equipo B',score:0},edit=false,mode='normal',finalRev={},finalSeconds=25,finalTimer=null,won=false;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>localStorage.setItem('granEncuestaV3',JSON.stringify({questions,finalQs,config}));
function tone(f=700,d=.15,type='sine'){try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}function correct(){tone(740,.1);setTimeout(()=>tone(1040,.18),90)}function wrong(){tone(120,.5,'sawtooth')}function victory(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.35),i*170))}
function pts(){return questions[qi].answers.reduce((s,a,i)=>s+(revealed[qi+'-'+i]?+a.points:0),0)*mult}function fpts(){return finalQs.reduce((s,x,i)=>s+(finalRev[i]?+x.points:0),0)}
function render(){app.innerHTML=`<main class="app"><header class="center"><span class="badge">🏆 GRAN ENCUESTA</span><h1 class="title">${esc(config.title)}</h1><div class="sub">${esc(config.subtitle)}</div></header>${mode==='normal'?normal():finalHTML()}${edit?editor():''}</main>`;let a=document.querySelector('#ta'),b=document.querySelector('#tb');if(a)a.oninput=e=>A.name=e.target.value;if(b)b.oninput=e=>B.name=e.target.value}
function normal(){let q=questions[qi];return `<section class="teams"><div class="team"><input id="ta" value="${esc(A.name)}"><b class="score">${A.score}</b></div><div class="vs">VS</div><div class="team"><input id="tb" value="${esc(B.name)}"><b class="score">${B.score}</b></div></section><div class="toolbar"><button class="btn blue" onclick="timerGo()">⏱ ${timer?'Pausar':'Iniciar'} ${seconds}s</button><button class="btn light" onclick="timerReset();render()">30s</button>${[1,2,3].map(n=>`<button class="btn ${mult===n?'yellow':'light'}" onclick="mult=${n};render()">x${n}</button>`).join('')}<button class="btn light" onclick="document.documentElement.requestFullscreen?.()">⛶ Pantalla completa</button></div><section class="board"><div class="meta"><span>RONDA ${qi+1} / ${questions.length}</span><span>⚡ BOLSA: ${pts()}</span></div><h2 class="question">${esc(q.question)}</h2><div class="answers">${q.answers.map((x,i)=>`<button class="answer ${revealed[qi+'-'+i]?'revealed':''}" onclick="reveal(${i})"><span class="num">${i+1}</span><span class="answerText">${revealed[qi+'-'+i]?esc(x.text):'••••••••••'}</span><b class="points">${revealed[qi+'-'+i]?x.points:'?'}</b></button>`).join('')}</div></section><div class="strikes">${Array(strikes).fill('<span class="strike">❌</span>').join('')}</div><div class="actions"><button class="btn red" onclick="strikes=Math.min(3,strikes+1);wrong();render()">❌ ERROR</button><button class="btn light" onclick="strikes=Math.max(0,strikes-1);render()">Quitar error</button><button class="btn blue" onclick="bank=pts();render()">Guardar bolsa</button><button class="btn yellow" onclick="award('A')">🏆 A +${bank||pts()}</button><button class="btn yellow" onclick="award('B')">🏆 B +${bank||pts()}</button><button class="btn green" onclick="next()">SIGUIENTE RONDA</button><button class="btn purple" onclick="mode='final';timerReset();render()">RONDA FINAL</button><button class="btn light" onclick="edit=!edit;render()">⚙️ EDITAR TODO</button></div>`}
function finalHTML(){let p=fpts();if(p>=config.goal&&!won){won=true;setTimeout(victory,100)}return `<section class="final"><div class="meta"><span>🏆 RONDA FINAL</span><span>META ${config.goal} | TOTAL ${p}</span></div>${p>=config.goal?'<div class="winner">¡GANADORES!</div>':''}<div class="toolbar"><button class="btn purple" onclick="finalGo()">⏱ ${finalTimer?'Pausar':'Iniciar'} ${finalSeconds}s</button><button class="btn light" onclick="finalReset();render()">25s</button></div>${finalQs.map((x,i)=>`<div class="finalQ"><b>${i+1}. ${esc(x.question)}</b><button class="answer ${finalRev[i]?'revealed':''}" onclick="finalReveal(${i})"><span class="answerText">${finalRev[i]?esc(x.answer):'RESPUESTA OCULTA'}</span><span class="points">${finalRev[i]?x.points:'?'}</span></button></div>`).join('')}<div class="actions"><button class="btn blue" onclick="mode='normal';render()">VOLVER</button><button class="btn light" onclick="finalRev={};won=false;finalReset();render()">REINICIAR FINAL</button><button class="btn light" onclick="edit=!edit;render()">⚙️ EDITAR TODO</button></div></section>`}
function editor(){let q=questions[qi];return `<section class="editor"><h2>Panel del conductor: editar todo</h2><label>Título</label><input value="${esc(config.title)}" onchange="config.title=this.value;save();render()"><label>Subtítulo</label><input value="${esc(config.subtitle)}" onchange="config.subtitle=this.value;save();render()"><h3>Rondas normales</h3><div class="tabs">${questions.map((_,i)=>`<button class="btn ${i===qi?'blue':'light'}" onclick="qi=${i};mode='normal';render()">Ronda ${i+1}</button>`).join('')}<button class="btn green" onclick="addQ()">+ Ronda</button><button class="btn red" onclick="delQ()">Eliminar ronda</button></div><input value="${esc(q.question)}" onchange="q.question=this.value;save();render()">${q.answers.map((x,i)=>`<div class="row"><input value="${esc(x.text)}" onchange="questions[qi].answers[${i}].text=this.value;save()"><input type="number" value="${x.points}" onchange="questions[qi].answers[${i}].points=+this.value;save();render()"><button class="btn red" onclick="questions[qi].answers.splice(${i},1);save();render()">🗑</button></div>`).join('')}<button class="btn blue" onclick="q.answers.push({text:'Nueva respuesta',points:0});save();render()">+ Respuesta</button><h3>Ronda final</h3><label>Meta</label><input type="number" value="${config.goal}" onchange="config.goal=+this.value;save();render()">${finalQs.map((x,i)=>`<div class="row" style="grid-template-columns:1fr 1fr 90px 44px"><input value="${esc(x.question)}" onchange="finalQs[${i}].question=this.value;save()"><input value="${esc(x.answer)}" onchange="finalQs[${i}].answer=this.value;save()"><input type="number" value="${x.points}" onchange="finalQs[${i}].points=+this.value;save();render()"><button class="btn red" onclick="finalQs.splice(${i},1);save();render()">🗑</button></div>`).join('')}<button class="btn green" onclick="finalQs.push({question:'Nueva pregunta final',answer:'Respuesta',points:0});save();render()">+ Pregunta final</button><div class="actions"><button class="btn light" onclick="exportData()">⬇ Exportar configuración</button><label class="btn light">⬆ Importar<input class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"></label><button class="btn red" onclick="localStorage.removeItem('granEncuestaV3');location.reload()">Restaurar valores iniciales</button></div></section>`}
function reveal(i){let k=qi+'-'+i,on=!revealed[k];revealed[k]=on;if(on)correct();render()}function award(t){let p=bank||pts();t==='A'?A.score+=p:B.score+=p;bank=0;render()}function next(){Object.keys(revealed).filter(k=>k.startsWith(qi+'-')).forEach(k=>delete revealed[k]);qi=(qi+1)%questions.length;Object.keys(revealed).filter(k=>k.startsWith(qi+'-')).forEach(k=>delete revealed[k]);strikes=0;bank=0;mult=1;timerReset();render()}function timerGo(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);timer=null;seconds=0;wrong()}render()},1000);render()}function timerReset(){if(timer)clearInterval(timer);timer=null;seconds=30}function finalGo(){if(finalTimer){clearInterval(finalTimer);finalTimer=null}else finalTimer=setInterval(()=>{finalSeconds--;if(finalSeconds<=0){clearInterval(finalTimer);finalTimer=null;finalSeconds=0;wrong()}render()},1000);render()}function finalReset(){if(finalTimer)clearInterval(finalTimer);finalTimer=null;finalSeconds=25}function finalReveal(i){let on=!finalRev[i];finalRev[i]=on;if(on)correct();render()}function addQ(){questions.push({question:'Nueva pregunta',answers:[{text:'Respuesta 1',points:0}]});qi=questions.length-1;save();render()}function delQ(){if(questions.length<2)return;questions.splice(qi,1);qi=Math.max(0,qi-1);save();render()}function exportData(){let b=new Blob([JSON.stringify({questions,finalQs,config},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='configuracion-juego.json';a.click()}function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);questions=d.questions||questions;finalQs=d.finalQs||finalQs;config=d.config||config;save();render()}catch(e){alert('JSON inválido')}};r.readAsText(f)}render();
</script></body></html>
