<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gran Encuesta en Vivo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#1744a5,#06133c 48%,#020617);color:#fff;min-height:100vh}.app{max-width:1120px;margin:auto;padding:18px}.center{text-align:center}.badge{display:inline-block;background:#facc15;color:#08225a;font-weight:900;padding:9px 20px;border-radius:99px}.title{font-size:clamp(32px,6vw,62px);margin:9px 0 3px}.sub{color:#a5f3fc;letter-spacing:3px;font-weight:bold}.status{position:fixed;right:10px;top:10px;padding:7px 10px;border-radius:99px;background:#064e3b;font-size:12px;z-index:10}.offline{background:#991b1b}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:18px 0}.team,.board,.panel,.final,.login{background:#071b50e8;border:1px solid #38bdf866;border-radius:20px;padding:17px}.team{display:flex;justify-content:space-between;align-items:center}.score{font-size:42px;font-weight:900;color:#fde047}.vs{background:#fde047;color:#08225a;font-weight:900;padding:14px;border-radius:50%}.toolbar,.actions,.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:13px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.blue{background:#0284c7;color:#fff}.yellow{background:#facc15;color:#08225a}.green{background:#059669;color:#fff}.red{background:#dc2626;color:#fff}.purple{background:#7c3aed;color:#fff}.light{background:#e2e8f0;color:#0f172a}.board{border:4px solid #facc15}.meta{display:flex;justify-content:space-between;color:#a5f3fc;font-weight:bold}.question{text-align:center;font-size:clamp(24px,4vw,40px)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:74px;background:linear-gradient(90deg,#06133d,#17134e);border:2px solid #0891b2;border-radius:13px;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 15px;width:100%}.admin .answer{cursor:pointer}.answer.revealed{background:linear-gradient(90deg,#fde047,#fb923c);color:#08225a;border-color:white}.num{background:#1d4ed8;color:#fff;border-radius:8px;padding:10px 14px;font-weight:900}.answerText{flex:1;text-align:left;font-size:20px;font-weight:900}.points{font-size:27px}.strikes{height:88px;display:flex;justify-content:center;align-items:center;font-size:58px}.panel{background:#fff;color:#0f172a;margin-top:18px}.panel input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.row{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin:7px 0}.final{border:4px solid #a855f7}.finalQ{background:#ffffff12;padding:11px;border-radius:11px;margin:8px 0}.winner{text-align:center;color:#fde047;font-size:clamp(42px,8vw,82px);font-weight:1000}.login{max-width:440px;margin:70px auto}.login input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0}.hidden{display:none}@media(max-width:700px){.answers,.teams{grid-template-columns:1fr}.vs{display:none}}
</style></head><body><div id="app"></div><script>
const adminMode=new URLSearchParams(location.search).get('admin')==='1';let sb,state,user=null,timer=null,finalTimer=null,editing=false,connected=false;
function tone(f=700,d=.15,type='sine'){try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.11,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}function correct(){tone(740,.1);setTimeout(()=>tone(1040,.18),90)}function wrong(){tone(120,.5,'sawtooth')}function win(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.35),i*170))}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function boot(){if(!SUPABASE_URL.startsWith('http')){app.innerHTML='<div class="login"><h2>Falta configurar Supabase</h2><p>Edita supabase-config.js con Project URL y Publishable key.</p></div>';return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);if(adminMode){let r=await sb.auth.getUser();user=r.data.user;if(!user){renderLogin();return}}await load();subscribe()}
async function load(){let {data,error}=await sb.from('game_sessions').select('state').eq('id',GAME_ID).single();if(error){app.innerHTML=`<div class="login"><h2>Error al cargar</h2><p>${esc(error.message)}</p></div>`;return}state=data.state;connected=true;render()}
function subscribe(){sb.channel('live-game').on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_sessions',filter:`id=eq.${GAME_ID}`},p=>{state=p.new.state;connected=true;render()}).subscribe(s=>{connected=s==='SUBSCRIBED';render()})}
async function save(){if(!adminMode||!user)return;await sb.from('game_sessions').update({state,updated_at:new Date().toISOString()}).eq('id',GAME_ID)}
function safeSave(){save();render()}function g(){return state.game}function q(){return state.questions[g().qi]}function pts(){return q().answers.reduce((s,a,i)=>s+(g().revealed[g().qi+'-'+i]?+a.points:0),0)*g().mult}function fpts(){return state.finalQs.reduce((s,x,i)=>s+(g().finalRevealed[i]?+x.points:0),0)}
function header(){return `<div class="status ${connected?'':'offline'}">${connected?'● EN VIVO':'● SIN CONEXIÓN'}</div><header class="center"><span class="badge">🏆 GRAN ENCUESTA</span><h1 class="title">${esc(state.config.title)}</h1><div class="sub">${esc(state.config.subtitle)}</div></header>`}
function render(){if(!state)return;app.innerHTML=`<main class="app ${adminMode?'admin':''}">${header()}${g().mode==='final'?finalHTML():normalHTML()}${adminMode&&editing?editorHTML():''}</main>`}
function normalHTML(){return `<section class="teams"><div class="team"><b>${esc(g().teamA.name)}</b><span class="score">${g().teamA.score}</span></div><div class="vs">VS</div><div class="team"><b>${esc(g().teamB.name)}</b><span class="score">${g().teamB.score}</span></div></section><section class="board"><div class="meta"><span>RONDA ${g().qi+1}/${state.questions.length}</span><span>⚡ BOLSA ${pts()}</span></div><h2 class="question">${esc(q().question)}</h2><div class="answers">${q().answers.map((a,i)=>`<button class="answer ${g().revealed[g().qi+'-'+i]?'revealed':''}" ${adminMode?`onclick="reveal(${i})"`:''}><span class="num">${i+1}</span><span class="answerText">${g().revealed[g().qi+'-'+i]?esc(a.text):'••••••••••'}</span><b class="points">${g().revealed[g().qi+'-'+i]?a.points:'?'}</b></button>`).join('')}</div></section><div class="strikes">${'❌'.repeat(g().strikes)}</div>${adminMode?controls():''}`}
function controls(){return `<div class="toolbar"><button class="btn blue" onclick="timerGo()">⏱ ${timer?'Pausar':'Iniciar'} ${g().seconds}s</button>${[1,2,3].map(n=>`<button class="btn ${g().mult===n?'yellow':'light'}" onclick="g().mult=${n};safeSave()">x${n}</button>`).join('')}</div><div class="actions"><button class="btn red" onclick="g().strikes=Math.min(3,g().strikes+1);wrong();safeSave()">❌ ERROR</button><button class="btn light" onclick="g().strikes=Math.max(0,g().strikes-1);safeSave()">Quitar error</button><button class="btn yellow" onclick="award('A')">Puntos A</button><button class="btn yellow" onclick="award('B')">Puntos B</button><button class="btn green" onclick="next()">SIGUIENTE</button><button class="btn purple" onclick="g().mode='final';safeSave()">RONDA FINAL</button><button class="btn light" onclick="editing=!editing;render()">⚙️ EDITAR</button><button class="btn light" onclick="resetGame()">REINICIAR</button></div>`}
function finalHTML(){let p=fpts();return `<section class="final"><div class="meta"><span>🏆 RONDA FINAL</span><span>META ${state.config.goal} | TOTAL ${p}</span></div>${p>=state.config.goal?'<div class="winner">¡GANADORES!</div>':''}${state.finalQs.map((x,i)=>`<div class="finalQ"><b>${i+1}. ${esc(x.question)}</b><button class="answer ${g().finalRevealed[i]?'revealed':''}" ${adminMode?`onclick="finalReveal(${i})"`:''}><span class="answerText">${g().finalRevealed[i]?esc(x.answer):'RESPUESTA OCULTA'}</span><b class="points">${g().finalRevealed[i]?x.points:'?'}</b></button></div>`).join('')}${adminMode?`<div class="actions"><button class="btn purple" onclick="finalGo()">⏱ ${finalTimer?'Pausar':'Iniciar'} ${g().finalSeconds}s</button><button class="btn blue" onclick="g().mode='normal';safeSave()">VOLVER</button><button class="btn light" onclick="editing=!editing;render()">⚙️ EDITAR</button></div>`:''}</section>`}
function editorHTML(){return `<section class="panel"><h2>Panel del administrador</h2><label>Título</label><input value="${esc(state.config.title)}" onchange="state.config.title=this.value;save()"><label>Subtítulo</label><input value="${esc(state.config.subtitle)}" onchange="state.config.subtitle=this.value;save()"><label>Equipo A</label><input value="${esc(g().teamA.name)}" onchange="g().teamA.name=this.value;save()"><label>Equipo B</label><input value="${esc(g().teamB.name)}" onchange="g().teamB.name=this.value;save()"><h3>Rondas</h3><div class="tabs">${state.questions.map((_,i)=>`<button class="btn ${i===g().qi?'blue':'light'}" onclick="g().qi=${i};safeSave()">${i+1}</button>`).join('')}<button class="btn green" onclick="state.questions.push({question:'Nueva pregunta',answers:[{text:'Respuesta',points:0}]});g().qi=state.questions.length-1;safeSave()">+ Ronda</button></div><input value="${esc(q().question)}" onchange="q().question=this.value;save()">${q().answers.map((a,i)=>`<div class="row"><input value="${esc(a.text)}" onchange="q().answers[${i}].text=this.value;save()"><input type="number" value="${a.points}" onchange="q().answers[${i}].points=+this.value;save()"><button class="btn red" onclick="q().answers.splice(${i},1);safeSave()">🗑</button></div>`).join('')}<button class="btn blue" onclick="q().answers.push({text:'Nueva respuesta',points:0});safeSave()">+ Respuesta</button><h3>Ronda final</h3><label>Meta</label><input type="number" value="${state.config.goal}" onchange="state.config.goal=+this.value;save()">${state.finalQs.map((x,i)=>`<div class="row" style="grid-template-columns:1fr 1fr 90px"><input value="${esc(x.question)}" onchange="state.finalQs[${i}].question=this.value;save()"><input value="${esc(x.answer)}" onchange="state.finalQs[${i}].answer=this.value;save()"><input type="number" value="${x.points}" onchange="state.finalQs[${i}].points=+this.value;save()"></div>`).join('')}<button class="btn green" onclick="state.finalQs.push({question:'Nueva pregunta final',answer:'Respuesta',points:0});safeSave()">+ Pregunta final</button><button class="btn red" onclick="logout()">Cerrar sesión</button></section>`}
function reveal(i){let k=g().qi+'-'+i,on=!g().revealed[k];g().revealed[k]=on;if(on)correct();safeSave()}function award(t){let p=pts();g()[t==='A'?'teamA':'teamB'].score+=p;safeSave()}function next(){Object.keys(g().revealed).filter(k=>k.startsWith(g().qi+'-')).forEach(k=>delete g().revealed[k]);g().qi=(g().qi+1)%state.questions.length;Object.keys(g().revealed).filter(k=>k.startsWith(g().qi+'-')).forEach(k=>delete g().revealed[k]);g().strikes=0;g().mult=1;g().seconds=30;safeSave()}function finalReveal(i){let on=!g().finalRevealed[i];g().finalRevealed[i]=on;if(on)correct();if(fpts()>=state.config.goal)setTimeout(win,200);safeSave()}function resetGame(){state.game={mode:'normal',qi:0,revealed:{},finalRevealed:{},strikes:0,mult:1,bank:0,teamA:{name:g().teamA.name,score:0},teamB:{name:g().teamB.name,score:0},seconds:30,finalSeconds:25};safeSave()}function timerGo(){if(timer){clearInterval(timer);timer=null;render()}else timer=setInterval(()=>{g().seconds--;if(g().seconds<=0){clearInterval(timer);timer=null;g().seconds=0;wrong()}save();render()},1000)}function finalGo(){if(finalTimer){clearInterval(finalTimer);finalTimer=null;render()}else finalTimer=setInterval(()=>{g().finalSeconds--;if(g().finalSeconds<=0){clearInterval(finalTimer);finalTimer=null;g().finalSeconds=0;wrong()}save();render()},1000)}
function renderLogin(){app.innerHTML=`<div class="login"><h2>Acceso del administrador</h2><input id="email" type="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button class="btn yellow" onclick="login()">Entrar</button><p>El público debe abrir el enlace sin <b>?admin=1</b>.</p></div>`}async function login(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return alert(error.message);user=(await sb.auth.getUser()).data.user;await load();subscribe()}async function logout(){await sb.auth.signOut();location.reload()}boot();
</script></body></html>
